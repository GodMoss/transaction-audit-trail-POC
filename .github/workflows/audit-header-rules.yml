name: Header Rules Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run header rules audit
        env:
          LOGIK_ADMIN_API_KEY: ${{ secrets.LOGIK_ADMIN_API_KEY }}
        run: node scripts/audit-header-rules.js
      - name: Show what was written (temporary - for verification only)
        run: |
          echo "Files in rules/:"
          ls -la rules/
          echo "---"
          echo "Example snapshot content:"
          cat rules/clearTotalDiscountAmount.json

